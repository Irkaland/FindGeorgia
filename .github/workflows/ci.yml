name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: findgeorgia_test
          POSTGRES_USER: findgeorgia
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findgeorgia -d findgeorgia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      RUN_POSTGRES_TESTS: "true"
      DATABASE_PROVIDER: postgres
      POSTGRES_URL: postgresql://findgeorgia:test-only-password@127.0.0.1:5432/findgeorgia_test
      POSTGRES_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build --tag find-georgia:${{ github.sha }} .
